[versions]
agp = "8.10.1"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.1"
googleServices     = "4.4.4"
concurrentFutures = "1.3.0"
splashscreen = "1.2.0"
hilt   = "2.59.2"
timber = "5.0.1"
hiltNavigation = "1.3.0"


# AndroidX
coreKtx            = "1.18.0"
lifecycleRuntime   = "2.10.0"
activityCompose    = "1.13.0"
composeBom         = "2026.05.01"
navigationCompose  = "2.9.8"
lifecycleViewmodel = "2.10.0"
room               = "2.8.4"
datastore          = "1.2.1"
appcompat          = "1.7.1"
material           = "1.14.0"
activityKtx        = "1.13.0"
constraintlayout   = "2.2.1"

# Testing
junit              = "4.13.2"
junitVersion       = "1.3.0"
espressoCore       = "3.7.0"

# Firebase
firebaseBom        = "34.14.0"

# Third-party
lottie             = "6.7.1"
coil               = "2.7.0"
supabase           = "3.6.0"
material3 = "1.4.0"
media3CommonKtx = "1.10.1"
foundation = "1.11.2"   # ⚠️ v3 unified — gotrue-kt renamed to auth-kt

[libraries]
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigation" }  # ← ADD
# AndroidX Core
androidx-core-ktx                  = { group = "androidx.core",            name = "core-ktx",                   version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx     = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntime" }
androidx-activity-compose          = { group = "androidx.activity",        name = "activity-compose",            version.ref = "activityCompose" }
androidx-appcompat                 = { group = "androidx.appcompat",       name = "appcompat",                   version.ref = "appcompat" }
androidx-activity-ktx              = { group = "androidx.activity",        name = "activity-ktx",                version.ref = "activityKtx" }
androidx-constraintlayout          = { group = "androidx.constraintlayout",name = "constraintlayout",            version.ref = "constraintlayout" }
androidx-concurrent-futures = { group = "androidx.concurrent", name = "concurrent-futures", version.ref = "concurrentFutures" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
hilt-android          = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-compiler         = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
timber                = { group = "com.jakewharton.timber", name = "timber",version.ref = "timber" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt", version.ref = "supabase" }

# Compose
androidx-compose-bom               = { group = "androidx.compose",         name = "compose-bom",                 version.ref = "composeBom" }
androidx-compose-ui                = { group = "androidx.compose.ui",      name = "ui" }
androidx-compose-ui-tooling        = { group = "androidx.compose.ui",      name = "ui-tooling" }
androidx-compose-ui-tooling-preview= { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
androidx-compose-material3         = { group = "androidx.compose.material3",name = "material3" }
androidx-compose-material-icons    = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-test           = { group = "androidx.compose.ui",      name = "ui-test-junit4" }

# Navigation & ViewModel
androidx-navigation-compose        = { group = "androidx.navigation",      name = "navigation-compose",          version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel       = { group = "androidx.lifecycle",       name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodel" }

# Room
androidx-room-runtime              = { group = "androidx.room",            name = "room-runtime",                version.ref = "room" }
androidx-room-ktx                  = { group = "androidx.room",            name = "room-ktx",                   version.ref = "room" }
androidx-room-compiler             = { group = "androidx.room",            name = "room-compiler",               version.ref = "room" }

# DataStore
androidx-datastore-preferences     = { group = "androidx.datastore",       name = "datastore-preferences",       version.ref = "datastore" }

# Material
material                           = { group = "com.google.android.material", name = "material",                version.ref = "material" }

# Firebase
firebase-bom                       = { group = "com.google.firebase",      name = "firebase-bom",                version.ref = "firebaseBom" }
firebase-auth                      = { group = "com.google.firebase",      name = "firebase-auth" }
firebase-firestore                 = { group = "com.google.firebase",      name = "firebase-firestore" }
firebase-messaging                 = { group = "com.google.firebase",      name = "firebase-messaging" }
firebase-analytics                 = { group = "com.google.firebase",      name = "firebase-analytics" }

# Supabase (v3 — gotrue-kt is now auth-kt)
supabase-postgrest                 = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt", version.ref = "supabase" }
supabase-auth                      = { group = "io.github.jan-tennert.supabase", name = "auth-kt",      version.ref = "supabase" }

# Third-party
lottie-compose                     = { group = "com.airbnb.android",       name = "lottie-compose",              version.ref = "lottie" }
coil-compose                       = { group = "io.coil-kt",               name = "coil-compose",                version.ref = "coil" }

# Testing
junit                              = { group = "junit",                    name = "junit",                       version.ref = "junit" }
androidx-junit                     = { group = "androidx.test.ext",        name = "junit",                       version.ref = "junitVersion" }
androidx-espresso-core             = { group = "androidx.test.espresso",   name = "espresso-core",               version.ref = "espressoCore" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-media3-common-ktx = { group = "androidx.media3", name = "media3-common-ktx", version.ref = "media3CommonKtx" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "foundation" }

[plugins]
android-application = { id = "com.android.application",            version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services     = { id = "com.google.gms.google-services",      version.ref = "googleServices" }
ksp                 = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }